[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "omega-evidence"
version = "0.14.1"
description = "Open, standard toolkit for verifiable, long-term compliance evidence"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Roberto Locatelli" }]
keywords = ["evidence", "audit", "hash-chain", "rfc3161", "eidas", "provenance", "compliance"]
dependencies = ["cryptography>=50.0.0"]

[project.urls]
Homepage = "https://github.com/robertolocatelli81-dev"

[tool.setuptools.packages.find]
include = ["omega_evidence*"]

[tool.setuptools.package-data]
"omega_evidence.pqbackends" = ["vectors/*.jsonl"]   # 0.12.0: the NIST vectors of the ML-DSA KAT gate ship in the wheel

[project.scripts]
omega-evidence-verify = "omega_evidence.verifier:main"
