name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.python-version == '3.9' && 'ubuntu-24.04' || 'ubuntu-26.04' }}   # 3.9 has no build for ubuntu-26.04 (ubuntu-latest from 2026-10-19)
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13", "3.14"]   # 3.14: the release build runs "3.x"; a verdict once depended on it (0.11.1)
        cryptography: ["yes", "no"]   # the toolkit runs without cryptography (pure-Python Ed25519); ML-DSA needs >= 50
    steps:
      - uses: actions/checkout@v7
      - name: "Set up Python ${{ matrix.python-version }}"
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: |
          python -m pip install --no-deps .
          if [ "${{ matrix.cryptography }}" = "yes" ]; then python -m pip install cryptography; fi
      - name: Run tests
        run: python tests/test_toolkit.py && python tests/test_stamp_granted.py && python tests/test_readme_version.py

  fuzz-smoke:
    # Short, deterministic (fixed seed): the same 3 000 mutations on every push, plus the six positive controls
    # (a verifier with one check disabled must make the fuzzer report violations). The weekly job explores further.
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install --no-deps . && python -m pip install cryptography
      - name: "Fuzz: 3 000 seeded mutations, no violation allowed"
        run: python tests/fuzz_toolkit.py --seed 20260928 --iterations 3000 --findings-dir fuzz-findings --json fuzz-smoke.json
      - name: "Positive controls: each disabled check must be seen"
        # shell: bash adds -o pipefail (the default shell is `bash -e` only): without it the exit code of this step was
        # tail's, so a fuzzer blind to an ablation (exit 1) passed green — found by the 29/09/2026 code review (D1)
        shell: bash
        run: |
          for a in signature pack-sha3 ledger-chain strict-json sig-alg-canonical require-signed; do
            python tests/fuzz_toolkit.py --seed 20260928 --iterations 3000 --ablate "$a" --findings-dir "ablation-$a" | tail -1
          done
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: fuzz-findings
          path: |
            fuzz-findings
            fuzz-smoke.json

  bench-smoke:
    # Only that the bench RUNS end to end on a small scale. No time threshold: a shared runner measures nothing.
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install --no-deps . && python -m pip install cryptography
      - name: "Bench smoke (scale 2 000, 20 000-entry batch run, latencies, memory)"
        run: python tests/bench_toolkit.py --smoke --json bench-smoke.json
      - uses: actions/upload-artifact@v7
        with:
          name: bench-smoke
          path: bench-smoke.json

  independent-verifiers:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: "Python reference with cryptography >= 50 (ML-DSA-65), so the hybrid cases are measured"
        run: pip install . cryptography
      - uses: actions/setup-node@v7
        with:
          node-version: "24"   # OpenSSL >= 3.5: the Node verifier checks ML-DSA-65 too
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"   # crypto/mldsa
      - uses: actions/setup-java@v6
        with:
          distribution: "oracle"
          java-version: "27"   # ML-DSA-65 since JDK 24, Ed25519 since 15
      - name: "Go verifier: vet, build"
        run: |
          (cd verifiers/go && go vet ./... && go build -o "$RUNNER_TEMP/oeverify" ./cmd/oeverify)
      - name: "Java verifier: compile"
        run: javac -d "$RUNNER_TEMP/oej" verifiers/java/OeVerify.java
      - name: "Differential oracle: Python vs Go vs Java vs Node must agree on every pack case"
        run: OEVERIFY_GO="$RUNNER_TEMP/oeverify" OEVERIFY_JAVA="java -cp $RUNNER_TEMP/oej OeVerify" python verifiers/differential_oracle.py

  cryptovalid-interop:
    # The ledger profile is cryptovalid's: a ledger written here must verify with the NEWEST cryptovalid-opencore
    # reference verifier from the index, and one changed byte must be refused. Measured on every change, not once.
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: |
          pip install . cryptography
          pip install --extra-index-url https://robertolocatelli81-dev.github.io/pypi/ cryptovalid-opencore
          python -c "import importlib.metadata as m; print('cryptovalid-opencore', m.version('cryptovalid-opencore'))"
      - name: "A ledger written here passes cryptovalid's verifier (exit 0); with one byte changed it is refused (exit 1)"
        run: |
          set -e
          python - <<'PY'
          from omega_evidence.ledger import Ledger
          L = Ledger("oe.jsonl")
          for i in range(5):
              L.append({"event": "cycle", "i": i})
          L.close()
          with open("oe.jsonl") as fh:
              t = fh.read()
          i = t.find('"i":1')
          assert i > 0
          with open("oe_tampered.jsonl", "w") as fh:
              fh.write(t[:i + 4] + "7" + t[i + 5:])
          PY
          cryptovalid-verify ledger oe.jsonl > /dev/null
          if cryptovalid-verify ledger oe_tampered.jsonl > /dev/null; then
            echo "::error::cryptovalid accepted a tampered omega-evidence ledger"; exit 1; fi
          echo "omega-evidence ledger: accepted intact, refused tampered, by cryptovalid-opencore $(python -c 'import importlib.metadata as m; print(m.version("cryptovalid-opencore"))')"
