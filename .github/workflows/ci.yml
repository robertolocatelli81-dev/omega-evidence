name: CI

on:
  push:
    branches: ["**"]   # every branch: release-0.14.1 is checked before it reaches main
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    # The whole suite on the three systems, every Python from the declared minimum (3.9) to the newest, with and
    # without cryptography (the only declared dependency; the toolkit runs without it on pure-Python Ed25519).
    # Where a system lacks a function the test uses that system's equivalent; it skips, with the reason, only what has none.
    # 3.9: ubuntu-24.04 (no 3.9 build for ubuntu-26.04 = ubuntu-latest); on macos-latest (arm64) and windows-latest
    # setup-python offers only 3.9.13, so 3.9 there is 3.9.13.
    runs-on: ${{ matrix.os == 'ubuntu' && (matrix.python-version == '3.9' && 'ubuntu-24.04' || 'ubuntu-latest') || matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu, macos-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]   # 3.14: the release build runs "3.x"
        cryptography: ["yes", "no"]
    steps:
      - uses: actions/checkout@v7
      - name: "Set up Python ${{ matrix.python-version }}"
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: "OpenSSL 3 on PATH (macOS: Homebrew openssl@3, /usr/bin/openssl is LibreSSL; Windows: the one of Git)"
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            (brew list openssl@3 >/dev/null 2>&1 || brew install openssl@3) && echo "$(brew --prefix openssl@3)/bin" >> "$GITHUB_PATH"
          elif [ "$RUNNER_OS" = "Windows" ]; then
            echo "C:\Program Files\Git\usr\bin" >> "$GITHUB_PATH"
          fi
      - name: "A full volume where there is no /dev/full (macOS: HFS+ RAM disk; Windows: FAT VHD), for the exit-74 tests"
        if: runner.os != 'Linux'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            dev=$(hdiutil attach -nomount ram://8192 | tr -d ' \t')
            diskutil erasevolume HFS+ oefull "$dev" >/dev/null
            d=/Volumes/oefull
          else
            printf 'create vdisk file="%s" maximum=8 type=fixed\nselect vdisk file="%s"\nattach vdisk\ncreate partition primary\nformat fs=fat quick label=OEFULL\nassign letter=Q\n' \
              "$RUNNER_TEMP\\full.vhd" "$RUNNER_TEMP\\full.vhd" > "$RUNNER_TEMP/dp.txt"
            diskpart //s "$(cygpath -w "$RUNNER_TEMP/dp.txt")" > /dev/null
            d='Q:\'
          fi
          python - "$d" <<'PY'
          import errno, os, sys
          d = sys.argv[1]
          with open(os.path.join(d, "filler"), "wb") as f:
              for size in (1 << 20, 1 << 12, 1 << 9, 1):
                  while True:
                      try:
                          f.write(b"\0" * size); f.flush(); os.fsync(f.fileno())
                      except OSError as e:
                          if e.errno != errno.ENOSPC:
                              raise
                          break
          # positive check: a new file there takes no byte, at the write itself (no fsync: the CLIs only flush)
          try:
              with open(os.path.join(d, "probe"), "wb", buffering=0) as f:
                  f.write(b"x" * 65536)
              sys.exit("the volume is not full")
          except OSError as e:
              assert e.errno == errno.ENOSPC, e
              print("full volume ready:", d, "ENOSPC on write")
          PY
          echo "OE_FULL_DIR=$d" >> "$GITHUB_ENV"
      - name: Install package
        shell: bash
        run: |
          python -m pip install --no-deps .
          # 3.9 runs the declared minimum of pyproject.toml (0.12.0: the oldest release with no OSV advisory), the others the newest
          if [ "${{ matrix.cryptography }}" = "yes" ]; then
            if [ "${{ matrix.python-version }}" = "3.9" ]; then python -m pip install "cryptography==50.0.0"; else python -m pip install cryptography; fi
          fi
          python -c "import sys, platform; print(sys.version, platform.platform())"; openssl version; command -v openssl
      - name: "The installed package registers ML-DSA-65 (0.12.0: the 0.11.4 wheel lacked the KAT vectors)"
        if: matrix.cryptography == 'yes'
        shell: bash
        run: cd "$RUNNER_TEMP" && python -I -c "from omega_evidence.pqbackends import mldsa; r = mldsa.try_load(); assert r['registered'], r; print(r['reason'])"
      - name: "Run every tests/test_*.py (exit74: the Python CLIs here; Node, Go and Java in independent-verifiers)"
        shell: bash
        run: |
          fail=0
          for f in tests/test_*.py; do
            args=""; [ "$f" = "tests/test_receipt_exit74.py" ] && args="TestPython TestPythonAAT"
            echo "::group::$f"
            python "$f" $args || { echo "::error::$f failed"; fail=1; }
            echo "::endgroup::"
          done
          exit $fail

  fuzz-smoke:
    # Short, deterministic (fixed seed): the same 3 000 mutations on every push, plus the six positive controls
    # (a verifier with one check disabled must make the fuzzer report violations). The weekly job explores further.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install --no-deps . && python -m pip install cryptography
      - name: "Fuzz: 3 000 seeded mutations, no violation allowed"
        run: python tests/fuzz_toolkit.py --seed 20260928 --iterations 3000 --findings-dir fuzz-findings --json fuzz-smoke.json
      - name: "Positive controls: each disabled check must be seen"
        # shell: bash adds -o pipefail (the default shell is `bash -e` only): without it the exit code of this step was
        # tail's, so a fuzzer blind to an ablation (exit 1) passed green — found by the 29/09/2026 code review (D1)
        shell: bash
        run: |
          for a in signature pack-sha3 ledger-chain strict-json sig-alg-canonical require-signed; do
            python tests/fuzz_toolkit.py --seed 20260928 --iterations 3000 --ablate "$a" --findings-dir "ablation-$a" | tail -1
          done
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: fuzz-findings
          path: |
            fuzz-findings
            fuzz-smoke.json

  bench-smoke:
    # Only that the bench RUNS end to end on a small scale. No time threshold: a shared runner measures nothing.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install --no-deps . && python -m pip install cryptography
      - name: "Bench smoke (scale 2 000, 20 000-entry batch run, latencies, memory)"
        run: python tests/bench_toolkit.py --smoke --json bench-smoke.json
      - uses: actions/upload-artifact@v7
        with:
          name: bench-smoke
          path: bench-smoke.json

  independent-verifiers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: "Python reference with cryptography >= 50 (ML-DSA-65), so the hybrid cases are measured"
        run: pip install . cryptography
      - uses: actions/setup-node@v7
        with:
          node-version: "24"   # OpenSSL >= 3.5: the Node verifier checks ML-DSA-65 too
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"   # crypto/mldsa
      - uses: actions/setup-java@v6
        with:
          distribution: "oracle"
          java-version: "27"   # ML-DSA-65 since JDK 24, Ed25519 since 15
      - name: "Go verifier: vet, build"
        run: |
          (cd verifiers/go && go vet ./... && go build -o "$RUNNER_TEMP/oeverify" ./cmd/oeverify)
      - name: "Java verifier: compile"
        run: javac -d "$RUNNER_TEMP/oej" verifiers/java/OeVerify.java
      - name: "Differential oracle: Python vs Go vs Java vs Node must agree on every pack case"
        run: OEVERIFY_GO="$RUNNER_TEMP/oeverify" OEVERIFY_JAVA="java -cp $RUNNER_TEMP/oej OeVerify" python verifiers/differential_oracle.py
      - name: "A receipt not written whole is exit 74 in the four CLIs (real processes: /dev/full, a closed pipe, stdout closed)"
        run: OE_EXIT74_REQUIRE_ALL=1 OEVERIFY_GO="$RUNNER_TEMP/oeverify" OEVERIFY_JAVA="java -cp $RUNNER_TEMP/oej OeVerify" python tests/test_receipt_exit74.py

  cryptovalid-interop:
    # The ledger profile is cryptovalid's: a ledger written here must verify with the NEWEST cryptovalid-opencore
    # reference verifier from the index, and one changed byte must be refused. Measured on every change, not once.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: |
          pip install . cryptography
          pip install --extra-index-url https://robertolocatelli81-dev.github.io/pypi/ cryptovalid-opencore
          python -c "import importlib.metadata as m; print('cryptovalid-opencore', m.version('cryptovalid-opencore'))"
      - name: "A ledger written here passes cryptovalid's verifier (exit 0); with one byte changed it is refused (exit 1)"
        run: |
          set -e
          python - <<'PY'
          from omega_evidence.ledger import Ledger
          L = Ledger("oe.jsonl")
          for i in range(5):
              L.append({"event": "cycle", "i": i})
          L.close()
          with open("oe.jsonl") as fh:
              t = fh.read()
          i = t.find('"i":1')
          assert i > 0
          with open("oe_tampered.jsonl", "w") as fh:
              fh.write(t[:i + 4] + "7" + t[i + 5:])
          PY
          cryptovalid-verify ledger oe.jsonl > /dev/null
          if cryptovalid-verify ledger oe_tampered.jsonl > /dev/null; then
            echo "::error::cryptovalid accepted a tampered omega-evidence ledger"; exit 1; fi
          echo "omega-evidence ledger: accepted intact, refused tampered, by cryptovalid-opencore $(python -c 'import importlib.metadata as m; print(m.version("cryptovalid-opencore"))')"
