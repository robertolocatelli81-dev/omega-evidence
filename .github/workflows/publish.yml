name: Publish to PyPI

# Trusted Publishing (OIDC): no API token stored anywhere. On a GitHub Release,
# this builds the package and PyPI verifies the release via short-lived OIDC
# tokens. Requires a one-time "trusted publisher" registration on PyPI (see
# README / repo docs): project omega-evidence, owner robertolocatelli81-dev,
# repo omega-evidence, workflow publish.yml, environment pypi.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Build sdist and wheel
        run: |
          python -m pip install build
          python -m build
      - name: Verify metadata
        run: |
          python -m pip install twine
          python -m twine check dist/*
      - name: Run tests before publishing
        run: |
          python -m pip install .
          python tests/test_toolkit.py
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI (trusted publishing)
    needs: build
    runs-on: ubuntu-latest
    environment: pypi          # protect this environment in repo settings if desired
    permissions:
      id-token: write          # REQUIRED for OIDC trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
